name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MinGW)
        run: |
          rustup default stable-x86_64-pc-windows-gnu
          rustup component add rustfmt clippy
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Advisory only. Clippy is not installed on every toolchain and this
      # codebase is mostly hand written Win32 FFI, so a strict lint gate would
      # fail the badge on style rather than on anything real.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --release --all-targets -- -W clippy::all

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Embed icon + manifest
        shell: pwsh
        run: |
          .\target\release\seticon.exe `
            .\target\release\usb-reformat.exe `
            .\ICON1.ico `
            .\manifest.xml `
            .\music
          if ($LASTEXITCODE -ne 0) { throw "seticon failed (exit $LASTEXITCODE)" }

      - name: Verify the exe was actually modified
        shell: pwsh
        run: |
          $exe = '.\target\release\usb-reformat.exe'
          if (-not (Test-Path $exe)) { throw 'usb-reformat.exe was not produced' }
          $size = (Get-Item $exe).Length
          Write-Host "usb-reformat.exe = $([math]::Round($size/1MB,2)) MB"
          if ($size -lt 200KB) { throw "exe looks wrong ($size bytes) - resources were not embedded" }

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: usb-reformat
          path: target/release/usb-reformat.exe
          if-no-files-found: error
